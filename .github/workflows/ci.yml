name: GreenQuote CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Test & Production Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: greenquote

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: greenquote/package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build --workspace=@greenquote/shared

      - name: TypeScript Typecheck Across All Workspaces (QG-1)
        run: npm run typecheck

      - name: Run Monorepo Test Suites (49 tests)
        env:
          PORT: 4000
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/greenquote_test
          JWT_SECRET: super_secret_test_jwt_key_32_characters_minimum!!
          JWT_REFRESH_SECRET: super_secret_test_refresh_key_32_chars_min!!
          PII_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: npm run test

      - name: Next.js 14 Production Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build --workspace=@greenquote/web

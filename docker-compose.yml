version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: greenquote-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: greenquote
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greenquote-network

  web:
    build:
      context: ./greenquote
      dockerfile: apps/web/Dockerfile
    container_name: greenquote-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/greenquote
      JWT_SECRET: production_jwt_secret_must_be_minimum_32_characters_long
      JWT_REFRESH_SECRET: production_refresh_secret_must_be_minimum_32_chars
      PII_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - greenquote-network

volumes:
  mongo_data:

networks:
  greenquote-network:
    driver: bridge
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    networks:
      - greenquote-network

volumes:
  mongo_data:

networks:
  greenquote-network:
    driver: bridge

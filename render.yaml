# ==============================================================================
# Render.com Blueprint — GreenQuote Standalone Next.js Deployment
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: greenquote
    runtime: node
    plan: free
    region: oregon # or ohio, frankfurt, singapore
    rootDir: greenquote
    buildCommand: npm install && npm run build --workspace=@greenquote/shared && npm run build --workspace=@greenquote/web
    startCommand: npm run start --workspace=@greenquote/web
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false # Paste your MongoDB Atlas connection string here
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PII_ENCRYPTION_KEY
        generateValue: true # 32-byte secret for AES-256 PII Vault
